<!DOCTYPE html>
<html>
<head>
    <title>Test Namebases</title>
</head>
<body>
    <h1>Testing namebases-real.js</h1>
    <div id="result"></div>
    <script>
        try {
            // Load the file
            const script = document.createElement('script');
            script.src = 'modules/namebases-real.js';
            script.onload = function() {
                document.getElementById('result').innerHTML = '<p style="color: green;">SUCCESS: File loaded without errors!</p>';
                console.log('File loaded successfully');
            };
            script.onerror = function() {
                document.getElementById('result').innerHTML = '<p style="color: red;">ERROR: Failed to load file!</p>';
                console.error('Failed to load file');
            };
            document.head.appendChild(script);
        } catch (e) {
            document.getElementById('result').innerHTML = '<p style="color: red;">ERROR: ' + e.message + '</p>';
            console.error(e);
        }
    </script>
</body>
</html>
